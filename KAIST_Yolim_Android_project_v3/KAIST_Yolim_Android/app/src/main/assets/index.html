<title>KAIST yo’lim</title>
<style>

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:4px 10px;font-size:14px;white-space:nowrap}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#a29bfe)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font-weight:700}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;margin-top:10px}
.btn.alt{background:var(--card);color:var(--tx);border:2px solid var(--ln)}
.sub{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx)}
.opt.ok{border-color:var(--ok);background:rgba(0,184,148,.18)}.opt.bad{border-color:var(--bad);background:rgba(225,112,85,.18)}
.exp{background:rgba(108,92,231,.12);border-left:4px solid var(--pri);padding:10px 12px;border-radius:8px;margin-top:10px}
.mut{color:var(--mut);font-size:14px}.big{font-size:44px;text-align:center;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mut);font-size:13px}nav button.on{color:var(--pri);font-weight:700}nav span{display:block;font-size:22px}
code{background:var(--ln);padding:1px 5px;border-radius:5px}

.videoBox{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:10px 0}
.videoFrame{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#100b2c;margin-top:10px}
.videoInput{width:100%;padding:12px;border:1px solid var(--ln);border-radius:11px;background:var(--bg);color:var(--tx);font:inherit;margin:8px 0}
.gameGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gameTile{border:1px solid var(--ln);border-radius:16px;padding:16px 10px;background:var(--card);color:var(--tx);text-align:center;font-weight:700;min-height:112px}
.gameTile b{display:block;font-size:30px;margin-bottom:6px}
.gameStat{font-size:14px;color:var(--mut)}
.iqPicture{font-size:46px;letter-spacing:8px;text-align:center;padding:22px 8px;background:linear-gradient(135deg,#eee9ff,#d9f4ff);border-radius:16px;margin:10px 0;color:#24145f}.shopItem{display:flex;align-items:center;gap:12px;justify-content:space-between}.shopItem .price{white-space:nowrap;font-weight:800;color:var(--pri)}
</style></head><body><div id="app"></div>
<nav><button id="n0" onclick="go(0)"><span>📚</span>Darslar</button><button id="n1" onclick="go(1)"><span>🎮</span>O’yin</button><button id="n2" onclick="go(2)"><span>👤</span>Profil</button></nav>

["(a+b)² nimaga teng?",["a²+b²","a²+2ab+b²","a²+ab+b²","2a+2b"],1,"Qavs kvadratida o’rtadagi 2ab ni unutmang: a²+2ab+b²."]]],

["36 km/soat necha m/s?",["10","36","100","3.6"],0,"km/soat dan m/s ga o’tish uchun 3.6 ga bo’linadi: 36÷3.6=10."],
["Zichlik formulasi qaysi?",["ρ=m/V","ρ=V/m","ρ=m·V","ρ=m+V"],0,"Zichlik = massa ÷ hajm."]]],
["Present Simple: he/she/it dan keyin fe’lga -s qo’shiladi: She plays.",[
["He ___ football every day.",["play","plays","playing","played"],1,"He — 3-shaxs birlik, shuning uchun plays."],
["“Library” o’zbekchada?",["kutubxona","kitob do’koni","maktab","o’quvchi"],0,"Library — kutubxona. Kitob do’koni esa bookshop."],
["They ___ students.",["is","am","are","be"],2,"They bilan are ishlatiladi."]]],

9:[["Kvadrat tenglama ax²+bx+c=0. Diskriminant D=b²−4ac. D>0 bo’lsa 2 ta ildiz, D=0 bo’lsa 1 ta, D<0 bo’lsa ildiz yo’q.",[

["x²−4=0 ildizlari?",["±2","2","4","±4"],0,"x²=4, demak x=2 yoki x=−2."],

["Nyutonning 2-qonuni: F=m·a (kuch = massa × tezlanish).",[

["Past Simple: tugagan ish. Fe’lga -ed qo’shiladi yoki noto’g’ri fe’l: go → went.",[

["for sikli takrorlaydi: for i in range(3) — i=0,1,2. if shart tekshiradi.",[
["for i in range(3): print(i) — necha marta chiqaradi?",["2","3","4","1"],1,"0, 1, 2 — jami 3 marta."],
[`if 5>3: print("ha") natijasi?`,["ha","hech narsa","xato","5"],0,"5>3 rost, shuning uchun ha chiqadi."],
["range(1,4) qanday sonlarni beradi?",["1,2,3,4","1,2,3","0,1,2,3","2,3,4"],1,"Oxirgi son (4) kirmaydi: 1,2,3."]]]],

["sin²x+cos²x=?",["0","1","2","sin 2x"],1,"Bu asosiy trigonometrik ayniyat: har doim 1."],

["Kinetik energiya Ek=mv²/2. Potensial energiya Ep=mgh.",[
["m=2 kg, v=3 m/s. Ek=?",["6 J","9 J","18 J","3 J"],1,"Ek=2·3²/2=9 J."],
["Energiya birligi?",["Nyuton","Joul","Vatt","Paskal"],1,"Energiya — Joul (J). Vatt — quvvat, Nyuton — kuch."],
["m=1 kg, h=10 m, g=10. Ep=?",["10 J","100 J","1 J","1000 J"],1,"Ep=1·10·10=100 J."]]],
["Present Perfect: have/has + V3. Natija hozirga bog’liq: I have finished.",[
["She ___ already eaten.",["have","has","is","did"],1,"She bilan has: has eaten."],
["Qaysi gap to’g’ri?",["I have seen him yesterday.","I saw him yesterday.","I have saw him.","I seen him."],1,"Yesterday aniq vaqt, shuning uchun Past Simple: saw."],

11:[["Hosila: (xⁿ)’=n·xⁿ⁻¹. Integral — hosilaga teskari amal: ∫xⁿdx=xⁿ⁺¹/(n+1)+C.",[
["(x³)’=?",["3x²","x²","3x","x⁴/4"],0,"Daraja oldinga tushadi, o’zi 1 ga kamayadi: 3x²."],
["∫2x dx=?",["x²+C","2+C","x+C","2x²+C"],0,"x² ning hosilasi 2x. Integralda +C ni unutmang."],
["lim(x→0) sin x / x = ?",["0","1","∞","−1"],1,"Bu birinchi ajoyib limit: 1."]]],

["U=12 V, R=4 Ω. I=?",["3 A","48 A","8 A","16 A"],0,"I=12÷4=3 A."],
["Ketma-ket ulangan 2 Ω va 3 Ω umumiy qarshilik?",["5 Ω","1.2 Ω","6 Ω","1 Ω"],0,"Ketma-ket ulanishda qarshiliklar qo’shiladi: 5 Ω."],
["U=10 V, I=2 A. P=?",["5 W","12 W","20 W","8 W"],2,"P=U·I=10·2=20 W."]]],

["If it rains, we ___ at home.",["stay","will stay","stayed","would stayed"],1,"Real holat: If + Present, will + V."],
["If I ___ rich, I would travel the world.",["am","were","will be","would be"],1,"Xayoliy holatda were ishlatiladi."],
["“Scholarship” o’zbekchada?",["stipendiya","sertifikat","imtihon","fakultet"],0,"Scholarship — stipendiya. KAIST uchun muhim so’z!"]]],

["4! (faktorial) =?",["10","24","16","12"],1,"4·3·2·1=24."],

};
const LV=["Yangi boshlovchi","Izlanuvchi","Dasturchi","Olimpiadachi","Tadqiqotchi","KAIST talabasi 🎓"];
let S={xp:0,streak:0,last:"",g:8,done:{},wrong:[],hints:0,skips:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("kaist")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("kaist",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id), A=$("app");
const day=d=>d.toISOString().slice(0,10);
function touch(){const t=day(new Date()),y=day(new Date(Date.now()-864e5));if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}}
function add(n){S.xp+=n;touch();save()}
const lvl=()=>Math.min(LV.length-1,Math.floor(S.xp/150));
function head(){const l=lvl(),p=(S.xp%150)/150*100;return `<div class="top"><h1>🚀 KAIST yo’lim</h1><span class="pill">🔥 ${S.streak}</span></div>
<div class="card"><div class="top"><b>${LV[l]}</b><span class="mut">${S.xp} XP</span></div><div class="bar" style="margin-top:8px"><i style="width:${l==5?100:p}%"></i></div></div>`}
function go(t){clearInterval(T);[0,1,2].forEach(i=>$("n"+i).classList.toggle("on",i==t));[home,game,prof][t]()}
function home(){
A.innerHTML=head()+`<button class="btn" onclick="course()">🌱 0 dan boshlash: boshlang’ich kurs</button><div class="chips" style="margin-top:12px">${[8,9,10,11].map(g=>`<button class="chip ${S.g==g?"on":""}" onclick="S.g=${g};save();home()">${g}-sinf</button>`).join("")}</div><h2>Fanni tanlang</h2>`+
SUB.map((s,i)=>{const b=S.done[S.g+"-"+i];return `<button class="sub" onclick="lesson(${i})"><span>${s}</span><span>${b==null?"▶":b==3?"⭐ 3/3":"✅ "+b+"/3"}</span></button>`}).join("")}
function lesson(i){const d=D[S.g][i];
A.innerHTML=`<button class="chip" onclick="home()" style="width:auto;flex:none">← Orqaga</button><h2>${SUB[i]} · ${S.g}-sinf</h2>
<div class="card"><b>📖 Dars</b><p>${d[0]}</p></div><button class="btn" onclick="quiz(${i})">Mashqni boshlash (3 savol)</button><h2>🎬 Video darslar</h2>${vg(i)}`}
let Q;
function quiz(i,list,back){Q={i,list:list||D[S.g][i][1],n:0,sc:0,back:back||0};ask()}
function ask(){const q=Q.list[Q.n];
A.innerHTML=`<div class="top"><span class="mut">Savol ${Q.n+1}/${Q.list.length}</span><span class="pill">✅ ${Q.sc}</span></div><div class="card"><b>${q[0]}</b></div>`+
q[1].map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join("")+`<div id="fb"></div>`}
function pick(k){const q=Q.list[Q.n],o=document.querySelectorAll(".opt");if(Q.lock)return;Q.lock=1;
o.forEach((b,j)=>{b.disabled=true;if(j==q[2])b.classList.add("ok");else if(j==k)b.classList.add("bad")});
let h;if(k==q[2]){Q.sc++;add(10);S.wrong=S.wrong.filter(w=>w[0]!=q[0]);h=`<div class="exp">🎉 To’g’ri! +10 XP</div>`}
else{if(!S.wrong.some(w=>w[0]==q[0]))S.wrong.push(q);save();h=`<div class="exp">💡 <b>To’g’ri javob: ${q[1][q[2]]}</b><br>${q[3]}</div>`}
$("fb").innerHTML=h+`<button class="btn" onclick="nextQ()">${Q.n+1<Q.list.length?"Keyingisi →":"Natija"}</button>`}
function nextQ(){Q.lock=0;Q.n++;if(Q.n<Q.list.length)return ask();
if(!Q.back){const key=S.g+"-"+Q.i;S.done[key]=Math.max(S.done[key]||0,Q.sc)}
if(Q.cb){const[i,k]=Q.cb.split("-").map(Number),ok=Q.sc==Q.list.length;if(ok){S.c=S.c||{};S.c[Q.cb]=1;add(20)}save();
A.innerHTML=`<div class="big">${ok?"🌱":"📖"}</div><h1 style="text-align:center">${Q.sc}/${Q.list.length}</h1><p class="mut" style="text-align:center">${ok?"Dars o’zlashtirildi! +20 XP":"Keyingi dars ochilishi uchun hammasi to’g’ri bo’lishi kerak. Darsni yana bir o’qing."}</p><button class="btn" onclick="${ok&&k<3?`cLesson(${i},${k+1})`:ok?`courseSub(${i})`:`cLesson(${i},${k})`}">${ok&&k<3?"Keyingi dars →":ok?"Kursga qaytish":"Darsni qayta o’qish"}</button>`;return}
if(Q.sc==Q.list.length)add(20);save();
A.innerHTML=`<div class="big">${Q.sc==Q.list.length?"🏆":"💪"}</div><h1 style="text-align:center">${Q.sc}/${Q.list.length}</h1><p class="mut" style="text-align:center">${Q.sc==Q.list.length?"Mukammal! +20 XP bonus":"Xatolar ustida ishlash — o’sishning yo’li."}</p><button class="btn" onclick="go(${Q.back?2:0})">Davom etish</button>`}
// 0 dan boshlash kursi: har fan 4 dars, har darsda 2 savol
const C=[
[["Sonlar va amallar tartibi","Butun sonlar: ..., −2, −1, 0, 1, 2, ... Manfiy son nolning chap tomonida turadi.<br>Qo’shish: 5 + (−3) = 2.<br>Minus × minus = plyus: (−2)×(−4) = 8.<br><b>Amallar tartibi:</b> avval qavs, keyin ko’paytirish va bo’lish, oxirida qo’shish va ayirish.<br>Misol: 2 + 3×4 = 2 + 12 = 14.",[["2 + 3×4 = ?",["20","14","24","9"],1,"Avval ko’paytirish: 3×4=12, keyin 2+12=14."],["(−3) × (−2) = ?",["6","−6","5","−5"],0,"Minus × minus = plyus, demak 6."],["10 − 4 ÷ 2 = ?",["3","8","5","7"],1,"Avval bo’lish: 4÷2=2, keyin 10−2=8."],["−5 + 8 = ?",["3","−3","13","−13"],0,"Nol chizig’idan 5 chapga, keyin 8 o’ngga: natija 3."]]],

function iqHint(){if(!(S.hints>0)){alert('Maslahat olish uchun XP do‘konidan xarid qiling.');return}S.hints--;save();const box=$('iqFeedback');box.innerHTML=`<div class="exp">💡 ${IQ[IQi].h}</div>`;const b=document.querySelectorAll('.opt');b.forEach((el,k)=>{if(k!==IQ[IQi].a)el.style.opacity='.65'});}
function iqPick(k){if(IQlocked)return;IQlocked=true;const q=IQ[IQi],ok=k===q.a;if(ok)IQscore++;document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===k)b.classList.add('bad')});$('iqFeedback').innerHTML=`<div class="exp">${ok?'🎉 To‘g‘ri!':'💡 To‘g‘ri javob: '+q.o[q.a]}<br>${q.e}</div><button class="btn" onclick="iqNext()">${IQi===IQ.length-1?'Natijani ko‘rish':'Keyingi savol →'}</button><button class="btn alt" onclick="iqSkip()">⏭️ Savolni o‘tkazish (${S.skips||0})</button>`}
